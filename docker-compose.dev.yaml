services:
  # --- Grant's Main Page (Dev Mode) ---
  # For Astro development, run `bun run dev` locally instead of using Docker:
  #   cd Grant && bun install && bun run dev
  # 
  # This container is for testing the production build locally:
  grantSite:
    build:
      context: .
      dockerfile: ./bun-server/Dockerfile
    image: grantsite-dev
    container_name: grantSite-dev
    restart: "no"
    ports:
      - "127.0.0.1:${GRANT_SITE_PORT}:8080"
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # For pure local Astro dev with hot reload, use:
  #   cd Grant && bun run dev
  # This gives you instant updates without rebuilding Docker.

