services:
  # --- Grant's Main Page ---
  grantSite:
    build:
      context: .
      dockerfile: ./bun-server/Dockerfile
    image: grantsite-prod # Explicit lowercase image name required
    container_name: grantSite
    restart: unless-stopped
    # NOTE: No volume mount - Astro builds static files inside the container during docker build
    # The Dockerfile copies Grant/ → builds with Astro → serves from dist/
    ports:
      - "127.0.0.1:${GRANT_SITE_PORT}:8080" # Bind to localhost only; expose via reverse proxy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --- Portainer ---
  portainer:
    image: portainer/portainer-ce:2.39.1-alpine
    container_name: portainer-ce
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTAINER_PORT}:9000" # Bind to localhost only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Portainer requires write access to manage Docker
      - portainer_data:/data # Persists Portainer's data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- Uptime Kuma - Monitoring Dashboard ---
  uptime-kuma:
    image: louislam/uptime-kuma:2.2.1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT}:3001" # Bind to localhost only
    volumes:
      - uptime_kuma_data:/app/data # Persists Uptime Kuma's data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001', r => process.exit(r.statusCode < 400 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- PrivateBin - Secure Pastebin ---
  privatebin:
    image: privatebin/nginx-fpm-alpine:1.7.6
    container_name: privatebin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRIVATEBIN_PORT}:8080" # Bind to localhost only
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --- Cloudflare Tunnel Connector ---
  cloudflared:
    image: cloudflare/cloudflared:2026.5.0
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    # Note: A token is now the preferred method. You get the token from the
    # Cloudflare Zero Trust dashboard when you select your tunnel.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

